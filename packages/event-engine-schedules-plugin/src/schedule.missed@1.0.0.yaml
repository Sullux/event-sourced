$merge: schedule
description: |
  Emitted when an offline system recovers and detects missed execution windows.

$partitionKey: "({ scheduleId }) => 'schedule#' + scheduleId"
$deduplicationId: "({ scheduleId, occurrenceTimestamp }) => scheduleId + '#missed#' + occurrenceTimestamp"

type: object
properties:
  scheduleId:
    $ref: uuid
    type: string
  occurrenceTimestamp:
    type: number

required: [scheduleId, occurrenceTimestamp]
additionalProperties: false
