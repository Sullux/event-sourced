$merge: schedule
description: |
  Emitted when a schedule execution fails, enabling retry or dead-letter handling.

$partitionKey: "({ scheduleId }) => 'schedule#' + scheduleId"
$deduplicationId: "({ scheduleId, occurrenceTimestamp }) => scheduleId + '#failed#' + occurrenceTimestamp"

type: object
properties:
  scheduleId:
    $ref: uuid
    type: string
  occurrenceTimestamp:
    type: number
  error:
    type: string

required: [scheduleId, occurrenceTimestamp, error]
additionalProperties: false
