
$merge: coms
description: "Actor entity"
$partitionKey: "({ id }) => 'actor#' + id"
$deduplicationId: "id"
type: object
properties:
  id:
    $ref: uuid
    type: string
  name:
    type: string
  type:
    type: string
    enum: [individual, agent]
required: [id, name, type]
$dbSchema:
  actors:
    tableName: coms_actors
    columns:
      id: "varchar(32) PRIMARY KEY"
      name: "varchar(32) NOT NULL"
      type: "varchar(16) NOT NULL"
