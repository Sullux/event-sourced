$merge: daemon
description: |
  Emitted by a plugin to indicate it has completed its initialization.
$factory: true

$partitionKey: "({ plugin }) => 'daemon#plugin#' + plugin"
$deduplicationId: "({ plugin }) => 'daemon#plugin#started#' + plugin"

type: object
properties:
  plugin:
    $ref: "#/$defs/pluginName"
  startedAt:
    type: number

required: [plugin, startedAt]
additionalProperties: false
