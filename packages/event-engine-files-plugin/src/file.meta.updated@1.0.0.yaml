$merge: file
description: |
  Emitted when extended attributes, tags, or metadata properties are updated on a file link or blob.

$partitionKey: "({ targetId }) => 'meta#' + targetId"
$deduplicationId: "({ targetId, key }) => targetId + '#' + key"

type: object
properties:
  targetId:
    type: string
    description: Unique link ID or blob ID.
  key:
    type: string
  value:
    type: string

required: [targetId, key, value]
additionalProperties: false
