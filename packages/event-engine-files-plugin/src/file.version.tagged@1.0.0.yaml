$merge: file
description: |
  Emitted when a named version tag or checkpoint is pinned to a VFS link.

$partitionKey: "({ linkId }) => 'link#' + linkId"
$deduplicationId: "({ linkId, tagName }) => linkId + '#' + tagName"

type: object
properties:
  linkId:
    $ref: uuid
    type: string
  tagName:
    type: string
  blobId:
    type: string

required: [linkId, tagName, blobId]
additionalProperties: false
